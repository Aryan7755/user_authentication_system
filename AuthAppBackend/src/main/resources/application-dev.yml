# Development version of configurations
server:
  port: 8083

spring:
  application:
    name: project7

  # FIX: Correct hierarchy for virtual threads
  threads:
    virtual:
      enabled: true

  # Database configuration
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # NOTE: You don't need to specify dialect explicitly for modern Hibernate
        # but leaving it is fine if you prefer.
        format_sql: true
    show-sql: true

  # OAuth2 Client configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

# Custom Security Properties
security:
  jwt:
    secret: ${JWT_SECRET:this_is_a_super_long_and_very_secure_secret_key_that_is_at_least_64_characters_long_for_hs512_security}
    issuer: ${JWT_ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: false        # MUST be false for http://localhost
    cookie-same-site: Lax      # "Lax" is required for localhost
    cookie-domain: ""           # EMPTY - let the browser handle it
    cookie-http-only: true

# Frontend Redirection Properties
app:
  auth:
    frontend:
      success-redirect: http://localhost:5173/dashboard
      failure-redirect: http://localhost:5173/login